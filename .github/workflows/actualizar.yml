name: Actualizar datos

on:
  schedule:
    - cron: "17 4-23 * * *"   # cada hora, de 5:17 a 0:17 en Madrid (invierno; una hora más en verano)
  workflow_dispatch:         # botón «Run workflow» para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Leer posts nuevos y regenerar datos
        env:
          TUMBLR_API_KEY: ${{ secrets.TUMBLR_API_KEY }}
        run: python3 scripts/actualizar.py
      - name: Guardar cambios
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "inconsolata-bot"
          git config user.email "inconsolataweb@gmail.com"
          git add datos
          git commit -m "Actualización automática $(date -u +%F)"
          git push
      - name: Refrescar la caché de jsDelivr
        run: |
          m=$(date -u +%m); n=$(date -u -d "+1 day" +%m)
          for f in indice estadisticas especiales meta catalogo titulos portada portada_manual avisos archivo cronologia efemerides/$m efemerides/$n; do
            curl -s "https://purge.jsdelivr.net/gh/inconsolataweb/inconsolata-datos@main/datos/$f.json" > /dev/null || true
          done
