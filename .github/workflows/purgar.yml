name: Refrescar jsDelivr

# Al subir cambios de imágenes o datos, se vacía la caché de jsDelivr de esos archivos
# (el código del tema y los datos ya se cargan fijados a cada commit; esto es para los enlaces a @main)
on:
  push:
    branches: [main]
    paths: ['assets/**', 'datos/**', 'tema/**', '.github/workflows/purgar.yml']

jobs:
  purgar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Vaciar la caché de los archivos cambiados
        run: |
          # también el código del tema: si GitHub no responde al cargador (límite de consultas), la web tira de @main
          { git diff --name-only HEAD~1 HEAD -- assets datos tema; echo tema/tema.js; echo tema/tema.css; } | sort -u | while read f; do
            curl -s "https://purge.jsdelivr.net/gh/inconsolataweb/inconsolata-datos@main/$f" > /dev/null || true
          done
          sleep 5
          for f in tema/tema.js tema/tema.css; do
            curl -s -o /dev/null --max-time 60 -w "%{http_code} %{time_total}s @main/$f\n" "https://cdn.jsdelivr.net/gh/inconsolataweb/inconsolata-datos@main/$f" || true
          done
      - name: Precalentar la versión nueva en jsDelivr
        run: |
          # la web carga código y datos fijados a cada commit: se piden aquí para que el primer visitante no espere a que la CDN los prepare
          v=$(git rev-parse HEAD)
          for f in tema/tema.css tema/tema.js datos/meta.json datos/catalogo.json datos/titulos.json datos/ajustes_posts.json datos/portada.json datos/avisos.json datos/portada_manual.json datos/archivo.json datos/indice.json; do
            curl -s -o /dev/null --max-time 60 -w "%{http_code} %{time_total}s $f\n" "https://cdn.jsdelivr.net/gh/inconsolataweb/inconsolata-datos@$v/$f" || true
          done
