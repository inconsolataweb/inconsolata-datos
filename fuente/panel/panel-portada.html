<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de portada · inconsolata»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,700..900,0..100,0..1&display=swap">
<style>
:root{--ink:#16140F;--paper:#ECE7DC;--accent:#D1006F;--yellow:#FFD400;--muted:#5E5A50;--line:#CFC8B8;--ok:#1B7A3D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Archivo,system-ui,sans-serif}
a{color:var(--accent)}
.soft{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:900;font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 144}
.caps{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 32px 18px;border-bottom:2px solid var(--ink)}
header h1{margin:0;font-size:44px;line-height:1}
header h1 span{color:var(--accent)}
#estado{font-size:14px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;padding:0 32px;border-bottom:2px solid var(--ink);overflow-x:auto}
nav.tabs button{font:800 13px Archivo,sans-serif;letter-spacing:1.5px;text-transform:uppercase;background:none;border:0;padding:16px 14px 12px;cursor:pointer;color:var(--muted);border-bottom:4px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}
main{max-width:980px;padding:28px 32px 140px}
section[hidden]{display:none}
h2{font-size:34px;margin:0 0 6px;line-height:1.05}
.ayuda{color:var(--muted);margin:0 0 22px;max-width:720px}
.card{background:#fff;border:2px solid var(--ink);padding:18px 20px;margin-bottom:16px}
.card.off{opacity:.55}
.fila{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.fila.una{grid-template-columns:1fr}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
label small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:13px}
input,select,textarea{font:16px Archivo,sans-serif;color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:9px 10px;border-radius:0;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.chk{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:15px;font-weight:600}
.chk input{width:20px;height:20px}
.btn{font:800 13px Archivo,sans-serif;letter-spacing:1.5px;text-transform:uppercase;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{background:var(--ink);border-color:var(--ink)}
.btn.peq{min-height:36px;padding:6px 10px;font-size:11px}
.btn[disabled]{opacity:.4;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cab b{font-size:15px}
.vista{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:900;font-size:22px;line-height:1.1;margin-top:4px}
.vista em{font-style:inherit;color:var(--accent)}
.post{display:flex;gap:12px;align-items:center;border:2px dashed var(--line);padding:8px;min-height:64px}
.post img{width:64px;height:64px;object-fit:cover;background:var(--line);flex-shrink:0}
.post .pt{font-weight:800;font-size:15px;line-height:1.25}
.post .pm{font-size:13px;color:var(--muted)}
.post.vacio{color:var(--muted);font-size:14px;justify-content:center}
.ico-sel{display:flex;gap:8px;align-items:center}
.esp-ic{display:flex;gap:16px;align-items:flex-start}
.ei-v svg,.ei-0{width:64px;height:64px;display:grid;place-items:center;color:var(--ink);border:2px solid var(--line);padding:6px;background:var(--paper);box-sizing:border-box}
.ei-0{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.ico-sel svg{width:40px;height:40px;flex-shrink:0;color:var(--ink);border:2px solid var(--line);padding:4px;background:var(--paper)}
.faldon-v{background:var(--ink);color:var(--yellow);font:800 15px Archivo,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:12px 16px;white-space:nowrap;overflow:hidden;transform:rotate(-1deg);margin:6px 0 18px}
.faldon-v i{font-style:normal;color:#fff}
.nota{font-size:14px;background:#FFF6C2;border:2px solid var(--ink);padding:10px 14px;margin:0 0 18px}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding:14px 32px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:20}
.barra .btn{border-color:var(--paper);background:transparent;color:var(--paper)}
.barra .btn:hover{background:var(--paper);color:var(--ink)}
.barra .btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
#msg{font-size:15px}
#msg.ok{color:#9BE3B1}#msg.err{color:#FFB3C8}
dialog{border:2px solid var(--ink);padding:0;width:min(760px,94vw);max-height:86vh;background:var(--paper);box-shadow:10px 10px 0 var(--ink)}
dialog::backdrop{background:rgba(22,20,15,.55)}
.dlg-h{display:flex;gap:10px;padding:14px;border-bottom:2px solid var(--ink);align-items:center;position:sticky;top:0;background:var(--paper)}
.dlg-l{overflow:auto;max-height:62vh}
.dlg-l button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 14px;cursor:pointer;font:inherit;color:inherit}
.dlg-l button:hover,.dlg-l button:focus-visible{background:#fff}
.dlg-l img{width:52px;height:52px;object-fit:cover;background:var(--line);flex-shrink:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 14px Archivo,sans-serif;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:6px 10px;min-height:36px;cursor:pointer}
.chip:hover{background:var(--ink);color:var(--paper)}
.chip.quita{text-decoration:line-through;opacity:.55}
.chip.pon{border-color:var(--accent);color:var(--accent)}
code{background:#fff;padding:1px 5px;border:1px solid var(--line)}
ol.pasos li{margin-bottom:8px}
@media (max-width:640px){header,main,nav.tabs{padding-left:16px;padding-right:16px}.barra{padding:12px 16px}header h1{font-size:34px}}
</style>
</head>

<script>
var REPO='inconsolataweb/inconsolata-datos',RAW='https://raw.githubusercontent.com/'+REPO+'/main/datos/',API='https://api.github.com/repos/'+REPO+'/contents/datos/';
var ICONOS=["Elecciones", "Elecciones en EEUU", "Guerras y conflictos", "Guerra en Ucrania", "Conflicto palestino-israelí", "Guerra en Siria", "Guerra en Irán", "Terrorismo y atentados", "Catástrofes y accidentes", "COVID-19", "Salud", "Economía", "Europa", "Política española", "Monarquía y realeza", "El Papa y el Vaticano", "Cataluña y el procés", "Necrológicas", "Historia", "Resúmenes del año", "Ciencia y espacio", "Clima y medio ambiente", "Biodiversidad", "Viajes", "Tecnología", "Otros deportes", "Fútbol", "Juegos Olímpicos", "Mundiales y Eurocopas", "Motor y ciclismo", "Tenis", "Cine", "Música", "Televisión y series", "Libros y literatura", "Arte y arquitectura", "Gastronomía", "Rediseños", "Tipografía", "Humor gráfico", "Titulares", "Industria y crisis de medios", "Datos y visualización", "Urna", "Tren"];
var F={avisos:{orig:'',obj:null,sha:null},portada_manual:{orig:'',obj:null,sha:null},cronologia:{orig:'',obj:null,sha:null},titulos:{orig:'',obj:null,sha:null},ajustes_posts:{orig:'',obj:null,sha:null},especiales_iconos:{orig:'',obj:null,sha:null}};
var ETQ={},REG=[],AP='',POSTS=[],TIT={},MED=[],ESP=[],porId={};
function $(s,c){return (c||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hoy(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function token(){return ls('inc-panel-token')||'';}
function b64d(c){return decodeURIComponent(escape(atob(c.replace(/\s/g,''))));}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function fold(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function destaca(t){return esc(t).replace(/\*([^*]+)\*/g,'<em>$1</em>');}
var LBL={'t-urna':[50.5,15,40]};
function icoTxt(n,t){if(!n)return '<span class="ei-0">tipo</span>';var id='t-'+fold(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),L=LBL[id],lab='',fs;t=String(t||'').trim();
 if(t&&L){fs=Math.min(L[1],L[2]/t.length*1.75);lab='<text x="32" y="'+L[0]+'" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="'+fs.toFixed(1)+'" fill="currentColor">'+esc(t)+'</text>';}
 else if(t){fs=Math.min(14,50/t.length*1.75);lab='<rect x="4" y="46" width="56" height="17" rx="2" fill="currentColor"/><text x="32" y="59" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="'+fs.toFixed(1)+'" fill="#fff">'+esc(t)+'</text>';}
 return '<svg viewBox="0 0 64 64" aria-hidden="true" style="overflow:visible"><use href="#'+id+'"/>'+lab+'</svg>';}
function sym(n){var s='t-'+fold(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return '<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#'+s+'"/></svg>';}

// ---------- formato de los archivos (igual que los escribe el repositorio)
function linea(o){return '{'+Object.keys(o).map(function(k){var v=o[k];return JSON.stringify(k)+': '+(Array.isArray(v)?'['+v.map(function(x){return JSON.stringify(x);}).join(', ')+']':JSON.stringify(v));}).join(', ')+'}';}
function limpio(o){var r={};Object.keys(o).forEach(function(k){var v=o[k];if(v===''||v==null||(Array.isArray(v)&&!v.filter(Boolean).length))return;r[k]=Array.isArray(v)?v.filter(Boolean):v;});return r;}
function lista(a){return a.length?'[\n'+a.map(function(x){return ' '+linea(limpio(x));}).join(',\n')+'\n]':'[]';}
function texto(n){var o=F[n].obj;
 if(n==='titulos')return JSON.stringify(o);
 if(n==='especiales_iconos'){var ke=Object.keys(o).filter(function(k){return o[k]&&o[k].i;});return '{\n'+ke.map(function(k){var v={i:o[k].i,t:String(o[k].t||'').trim()};return JSON.stringify(k)+': '+JSON.stringify(v).replace(/":/g,'": ').replace(/,"/g,', "');}).join(',\n')+'\n}\n';}
 if(n==='ajustes_posts'){var ks=Object.keys(o).filter(function(k){var v=limpio(o[k]);if(v.pies&&!Object.keys(v.pies).filter(function(j){return String(v.pies[j]).trim();}).length)delete v.pies;return Object.keys(v).length;});return '{\n'+ks.map(function(k){var v=limpio(o[k]);if(v.pies){var pz={};Object.keys(v.pies).forEach(function(j){if(String(v.pies[j]).trim())pz[j]=String(v.pies[j]).trim();});if(Object.keys(pz).length)v.pies=pz;else delete v.pies;}return JSON.stringify(k)+': '+linea(v);}).join(',\n')+'\n}\n';}
 if(n==='cronologia')return '{\n"visible": '+(o.visible?'true':'false')+',\n"hitos": '+lista(o.hitos||[])+'\n}\n';
 if(n==='avisos'){var fa=o.faldon&&o.faldon.t?linea(limpio(o.faldon)):'null';return '{\n"grandes": '+lista(o.grandes||[])+',\n"ligeros": '+lista(o.ligeros||[])+',\n"faldon": '+fa+'\n}\n';}
 var one=function(x){if(!x)return 'null';x=limpio(x);return Object.keys(x).length?linea(x):'null';};
 return '{\n"apertura": '+one(o.apertura)+',\n"fijos": '+lista(o.fijos||[])+',\n"ocultos": '+(o.ocultos&&o.ocultos.length?'['+o.ocultos.map(function(x){return JSON.stringify(x);}).join(', ')+']':'[]')+',\n"destacado": '+one(o.destacado)+(o.colores&&Object.keys(o.colores).filter(function(k){return o.colores[k];}).length?',\n"colores": '+JSON.stringify((function(){var c={};Object.keys(o.colores).forEach(function(k){if(o.colores[k])c[k]=o.colores[k];});return c;})()):'')+'\n}\n';}
function sucio(n){return F[n].obj&&texto(n)!==F[n].orig;}

// ---------- carga
function getJSON(n,conApi){
 if(conApi&&token())return fetch(API+n+'.json?ref=main',{headers:{Authorization:'Bearer '+token(),Accept:'application/vnd.github+json'},cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('GitHub '+r.status);return r.json();}).then(function(j){return {txt:b64d(j.content),sha:j.sha};});
 return fetch(RAW+n+'.json?'+Date.now()).then(function(r){if(!r.ok)throw new Error(n+' '+r.status);return r.text();}).then(function(t){return {txt:t,sha:null};});}
function normal(n,o){o=o||{};if(n==='titulos'||n==='ajustes_posts'||n==='especiales_iconos')return o;if(n==='cronologia'){o.hitos=o.hitos||[];o.visible=!!o.visible;return o;}if(n==='avisos'){o.grandes=o.grandes||[];o.ligeros=o.ligeros||[];o.faldon=o.faldon||{};}
 else{o.colores=o.colores||{};o.fijos=(o.fijos||[]).map(function(x){return typeof x==='string'?{id:x}:x;});o.ocultos=o.ocultos||[];if(typeof o.apertura==='string')o.apertura={id:o.apertura};if(typeof o.destacado==='string')o.destacado={id:o.destacado};}return o;}
function cargaArchivos(){return Promise.all(Object.keys(F).map(function(n){return getJSON(n,true).then(function(r){F[n].obj=normal(n,JSON.parse(r.txt));F[n].sha=r.sha;F[n].orig=texto(n);});}));}
function carga(){
 Promise.all([cargaArchivos(),fetch(RAW+'archivo.json').then(function(r){return r.json();}),Promise.all([fetch(RAW+'etiquetas.json').then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}),fetch(RAW+'temas_reglas.json').then(function(r){return r.json();}).catch(function(){return [];})]).then(function(x){ETQ=x[0];REG=x[1];}),fetch(RAW+'especiales.json').then(function(r){return r.json();})])
 .then(function(r){var A=r[1];TIT=F.titulos.obj;MED=A.medios.map(function(m){return m.n;});ESP=r[3];
  POSTS=A.posts.map(function(p){var t=TIT[p.i]||p.t||'';var tt=p.t||'';var ms=(p.m||[]).map(function(i){return MED[i];}).filter(Boolean);
   var o={i:p.i,u:p.u,d:p.d,t:t,tt:tt,ms:ms,im:p.im||'',f:fold(t+' '+ms.join(' ')+' '+p.d)};porId[p.i]=o;return o;});
  $('#estado').textContent='Datos cargados: '+POSTS.length.toLocaleString('es')+' posts.'+(token()?' Conectado a GitHub.':' Sin conectar: ve a «Conexión» para publicar con un clic.');
  pintaTodo();})
 .catch(function(e){$('#estado').innerHTML='<b style="color:var(--accent)">No se han podido cargar los datos</b> ('+esc(e.message)+'). Comprueba la conexión y recarga.';});}

// ---------- piezas de formulario
function campo(lb,path,o,extra){extra=extra||{};var v=o[path];if(v==null)v='';var tp=extra.tipo||'text';
 var inp=tp==='area'?'<textarea data-k="'+path+'">'+esc(v)+'</textarea>':tp==='sel'?'<select data-k="'+path+'">'+extra.ops.map(function(x){return '<option value="'+esc(x[0])+'"'+(String(v)===String(x[0])?' selected':'')+'>'+esc(x[1])+'</option>';}).join('')+'</select>':'<input data-k="'+path+'" type="'+tp+'" value="'+esc(v)+'"'+(extra.ph?' placeholder="'+esc(extra.ph)+'"':'')+'>';
 return '<label'+(extra.ancho?' style="grid-column:1/-1"':'')+'>'+lb+(extra.ay?' <small>'+extra.ay+'</small>':'')+inp+'</label>';}
function icoCampo(o,k){k=k||'ico';return '<label>Icono <small>opcional, uno de los temas</small><span class="ico-sel"><select data-k="'+k+'"><option value="">— sin icono —</option>'+ICONOS.map(function(n){return '<option'+(o[k]===n?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>'+(o[k]?sym(o[k]):'')+'</span></label>';}
